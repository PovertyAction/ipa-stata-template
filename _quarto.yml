project:
  type: default
  title: "IPA Stata Analysis Project"

format:
  typst:
    margin:
      x: 1in
      y: 1in
    fontsize: 11pt
    mainfont: "Arial"
    toc: true
    number-sections: true

  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top

execute:
  echo: false
  warning: false
  message: false
  cache: false

bibliography: reports/references.bib

knitr:
  opts_chunk:
    fig.align: "center"
    fig.pos: "H"
    out.width: "90%"
